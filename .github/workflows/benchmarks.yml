name: Benchmarks

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1-mesa-dev xorg-dev xvfb
          go get ./...
      - name: Run benchmarks
        run: |
          go test -benchmem -run=^$ -bench ^.*$ ./...
