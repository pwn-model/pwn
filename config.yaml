seed: 1
tps: 30
fps: 30

resources:
  - type: WorldSize
    width: 4000
    height: 3000
    cell_size: 10
    grid_cell_size: 500

systems:
  # Initialization
  - type: InitGrids

  - type: InitTrees
    cell_probability: 0.6
    tree_probability: 0.9
    damage_prevalence: 0.03
    beetle_prevalence: 0.2

  # Systems
  - type: UpdateTime
    ticks_per_year: 52

  - type: DiseaseCourse
    ticks_to_damage: 8

  - type: RandomRelease
    tick_of_infection: 0
    num_trees: 10
    cell_x: 2
    cell_y: 2

  - type: DamageTrees
    tick_of_year: 35
    damage_probability: 0.01
    removal_probability: 0.333

  - type: BeetleEmergence
    tick_of_year: 19
    beetles_per_tree: 5
    life_expectancy: 5
  
  - type: TreeAttraction
    tick_of_year: 18
    damaged_trees: true
    half_distance: 50
    density_radius: 20
    density_weight: 1.0

  - type: TreeAttraction
    tick_of_year: 18
    damaged_trees: false
    half_distance: 50
    density_radius: 20
    density_weight: 1.0
  
  - type: BeetleMovement
    steps_per_tick:          7
    duration_feeding:       6
    duration_egg_laying:     6
    leave_tree_probability:  0.25
    random_walk_probability: 0.6

  - type: BeetleMortality

  - type: Colonization
    tick_of_year: 20
    cell_size: 100
    kernel_half_distance: 50
    kernel_radius: 300
    beetles_per_tree: 2.0
    trees_per_beetle: 1.0
  
  - type: NematodeInfection
    infection_probability: 0.01

  # Stop criterion
  - type: FixedTermination
    steps: 5200

  # Reporters
  - type: CSV
    observer:
      type: TreePopulation
    file: out/tree_pop.csv

windows:
  - title: Monitor
    drawers:
      - type: Monitor
        sample_interval: 333ms
      - type: Controls

  - title: Colonization time series
    drawers:
      - type: TimeSeries
        observer:
          type: TreeColonization
        labels:
          title: Tree colonization
          x: time [weeks]
          y: proportion colonized

  - title: Trees
    drawers:
      - type: Trees

  - title: Colonized trees
    drawers:
      - type: Image
        observer:
          type: TreeColonizationMap
          cell_size: 100
        colors: viridis
        max: 5

  - title: Beetles
    drawers:
      - type: Image
        observer:
          type: BeetlesMap
          cell_size: 10
        colors: viridis
        max: 10

  - title: Attraction
    drawers:
      - type: Image
        observer:
          type: TreeAttractionMap
          damaged_trees: true
        colors: viridis
        min: -8
        max: 0
